# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main]
  pull_request:

name: test-coverage.yaml

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      # Pin a Python with sqlglot so the lineage tests run rather than skip
      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: '3.12'

      - name: Install sqlglot and coverage.py
        run: pip install 'sqlglot>=23.0.0' coverage

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Test coverage
        env:
          RETICULATE_PYTHON: ${{ steps.setup-python.outputs.python-path }}
          # The sqlglot tests are gated on NOT_CRAN so they never start
          # Python on CRAN. Skipped, they would leave R/sqlglot_utils.R
          # reading as untested, so opt them back in as R-CMD-check does.
          NOT_CRAN: true
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          # Fail if error if not on PR, or if on PR and token is given
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || secrets.CODECOV_TOKEN }}
          files: ./cobertura.xml
          flags: r
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      # inst/python is only reached through reticulate, so a second pass of
      # the R suite measures it with coverage.py
      - name: Python coverage
        env:
          RETICULATE_PYTHON: ${{ steps.setup-python.outputs.python-path }}
          NOT_CRAN: true
        run: Rscript .github/scripts/python-coverage.R "$RUNNER_TEMP/coverage-python.xml"

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || secrets.CODECOV_TOKEN }}
          files: ${{ runner.temp }}/coverage-python.xml
          flags: python
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package

  # Unit tests for the parts of the widget JS that run without a browser.
  # They use Node's built-in runner, so no npm install. The React Flow render
  # path needs a browser; browser-coverage below measures it.
  js-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # Run from the repository root so the lcov paths match the repo layout
      - name: Test coverage
        run: >
          node --test --experimental-test-coverage
          --test-coverage-include='inst/htmlwidgets/lineage_flow.js'
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=coverage-js.lcov
          'srcjs/tests/**/*.test.js'

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || secrets.CODECOV_TOKEN }}
          files: ./coverage-js.lcov
          flags: js
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

  # Renders real widgets in headless Chrome (tests/browser). The suite runs
  # twice: against the shipped bundle, which is what users get, and against a
  # source-mapped build of the same sources, so coverage of the bundle can be
  # attributed to srcjs/src/index.js.
  browser-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: srcjs/package-lock.json

      # npm ci applies the @xyflow/system patch through the postinstall script
      - name: Build the source-mapped bundle
        working-directory: srcjs
        env:
          DPLYNEAGE_BUNDLE_OUT: ${{ runner.temp }}/bundle
        run: |
          npm ci
          npx webpack --config webpack.coverage.config.js

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::chromote
          needs: coverage

      - name: Browser tests against the shipped bundle
        env:
          DPLYNEAGE_BROWSER_SHOTS: ${{ runner.temp }}/shots
        run: Rscript .github/scripts/browser-tests.R

      - name: Browser tests against the source-mapped bundle, with coverage
        env:
          DPLYNEAGE_BROWSER_BUNDLE_DIR: ${{ runner.temp }}/bundle
          DPLYNEAGE_BROWSER_COVERAGE: ${{ runner.temp }}/v8
          DPLYNEAGE_BROWSER_SHOTS: ${{ runner.temp }}/shots
        run: Rscript .github/scripts/browser-tests.R

      - name: Convert V8 coverage to lcov
        run: node srcjs/scripts/v8-to-lcov.js "$RUNNER_TEMP/v8" coverage-browser.lcov

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || secrets.CODECOV_TOKEN }}
          files: ./coverage-browser.lcov
          flags: js
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload page screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-pages
          path: ${{ runner.temp }}/shots
